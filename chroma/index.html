<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chroma — Color Guessing Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
    }

    .back-link {
      position: fixed;
      top: 1rem;
      left: 1.25rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
      z-index: 10;
    }
    .back-link:hover { color: #e2e8f0; }

    .container {
      max-width: 760px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #f87171, #fb923c, #facc15, #4ade80, #38bdf8, #a78bfa, #f472b6);
      background-size: 200% 200%;
      animation: gradientShift 6s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1.05rem;
    }

    .game-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }

    .game-key {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      color: #64748b;
    }

    .randomize-btn {
      background: none;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.2rem 0.45rem;
      font-size: 1.1rem;
      cursor: pointer;
      color: #64748b;
      transition: color 0.2s, border-color 0.2s, transform 0.2s;
      line-height: 1;
      position: relative;
    }
    .randomize-btn:hover {
      color: #e2e8f0;
      border-color: #64748b;
      transform: rotate(90deg);
    }

    .instructions {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    /* --- Tiles --- */
    .tiles {
      display: flex;
      gap: 1.1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1.5rem 0 1.75rem;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      animation: tileIn 0.5s ease backwards;
    }
    .tile:nth-child(1) { animation-delay: 0.05s; }
    .tile:nth-child(2) { animation-delay: 0.12s; }
    .tile:nth-child(3) { animation-delay: 0.19s; }
    .tile:nth-child(4) { animation-delay: 0.26s; }
    .tile:nth-child(5) { animation-delay: 0.33s; }

    @keyframes tileIn {
      from { opacity: 0; transform: translateY(16px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tile-number {
      font-size: 0.7rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .swatch {
      width: 124px;
      height: 124px;
      border-radius: 1rem;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1), box-shadow 0.25s;
      cursor: default;
    }

    .swatch:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .hash-prefix {
      position: absolute;
      left: 0.55rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.95rem;
      color: #475569;
      pointer-events: none;
      user-select: none;
    }

    .hex-input {
      width: 100px;
      padding: 0.5rem 0.5rem 0.5rem 1.4rem;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 0.5rem;
      color: #e2e8f0;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.95rem;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .hex-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
    }

    .hex-input.invalid {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248,113,113,0.15);
    }

    .hex-input::placeholder { color: #334155; }

    .hex-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .guess-preview {
      width: 26px;
      height: 26px;
      border-radius: 0.4rem;
      border: 2px solid #334155;
      background: transparent;
      transition: background-color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .guess-preview.active { border-color: #475569; }

    /* --- Actions --- */
    .actions {
      text-align: center;
      margin: 0.5rem 0 1.5rem;
    }

    button {
      padding: 0.7rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      font-family: inherit;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 2px 14px rgba(59,130,246,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { border-color: #60a5fa; }

    .btn-small {
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
    }

    /* --- Results --- */
    .results {
      display: none;
    }

    .results.visible {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    .results-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .total-score {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .total-label {
      color: #64748b;
      font-size: 0.95rem;
      margin-top: 0.15rem;
    }

    .rating {
      font-size: 1.15rem;
      margin-top: 0.5rem;
    }

    .result-tiles {
      display: flex;
      gap: 1.1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .result-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      animation: slideUp 0.45s ease backwards;
    }
    .result-tile:nth-child(1) { animation-delay: 0.1s; }
    .result-tile:nth-child(2) { animation-delay: 0.22s; }
    .result-tile:nth-child(3) { animation-delay: 0.34s; }
    .result-tile:nth-child(4) { animation-delay: 0.46s; }
    .result-tile:nth-child(5) { animation-delay: 0.58s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .comparison {
      display: flex;
      border-radius: 1rem;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .comp-half {
      width: 60px;
      height: 120px;
      position: relative;
    }

    .comp-label {
      position: absolute;
      bottom: 4px;
      width: 100%;
      text-align: center;
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .result-score {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .result-hex {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.78rem;
      color: #64748b;
    }

    .result-guess-hex {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.72rem;
      color: #475569;
    }

    /* Score colors */
    .score-perfect { color: #4ade80; }
    .score-great   { color: #a3e635; }
    .score-good    { color: #facc15; }
    .score-ok      { color: #fb923c; }
    .score-poor    { color: #f87171; }

    /* --- Share --- */
    .share-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: #4ade80;
      border: 1px solid #334155;
      padding: 0.6rem 1.25rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* --- Responsive --- */
    @media (max-width: 680px) {
      h1 { font-size: 2.5rem; }
      .swatch { width: 100px; height: 100px; }
      .comp-half { width: 50px; height: 100px; }
      .tiles, .result-tiles { gap: 0.8rem; }
    }

    @media (max-width: 480px) {
      body { padding: 2rem 0.75rem 3rem; }
      h1 { font-size: 2rem; letter-spacing: 0.08em; }
      .swatch { width: 80px; height: 80px; border-radius: 0.75rem; }
      .comp-half { width: 40px; height: 80px; }
      .comparison { border-radius: 0.75rem; }
      .hex-input { width: 88px; font-size: 0.85rem; padding-left: 1.2rem; }
      .hash-prefix { font-size: 0.85rem; left: 0.45rem; }
      .guess-preview { width: 22px; height: 22px; }
      .tiles, .result-tiles { gap: 0.6rem; }
      .result-score { font-size: 1.25rem; }
      .total-score { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../">← Back</a>

  <div class="container">
    <header>
      <h1>CHROMA</h1>
      <p class="subtitle">How well do you know your colors?</p>
      <div class="game-info">
        <span class="game-key">Game <span id="game-key"></span></span>
        <button class="randomize-btn" id="randomize-btn" title="New random game">🎲</button>
      </div>
    </header>

    <p class="instructions">Guess the hex code for each color</p>

    <div class="tiles" id="tiles"></div>

    <div class="actions" id="actions">
      <button class="btn-primary" id="submit-btn">Submit Guesses</button>
    </div>

    <div class="results" id="results">
      <div class="results-header">
        <div class="total-score" id="total-score"></div>
        <div class="total-label">out of 50</div>
        <div class="rating" id="rating"></div>
      </div>
      <div class="result-tiles" id="result-tiles"></div>
      <div class="share-section">
        <button class="btn-primary btn-small" id="share-btn">📋 Copy Results</button>
        <button class="btn-secondary btn-small" id="retry-btn">🔄 Retry</button>
        <button class="btn-secondary btn-small" id="new-btn">🎲 New Game</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ===== Seeded PRNG (Mulberry32) ===== */
    function mulberry32(seed) {
      return function() {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    /* ===== FNV-1a hash ===== */
    function fnv1a(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return h >>> 0;
    }

    /* ===== Color generation from key ===== */
    const S = [99,104,82,48,109,52,95,112,82,49,115,109,95,118,50]
              .map(c => String.fromCharCode(c)).join('');

    function generateColors(key) {
      const seed = fnv1a(S + ':' + key + ':' + S);
      const rng = mulberry32(seed);
      const colors = [];
      for (let i = 0; i < 5; i++) {
        colors.push([
          Math.floor(rng() * 256),
          Math.floor(rng() * 256),
          Math.floor(rng() * 256)
        ]);
      }
      return colors;
    }

    /* ===== Helpers ===== */
    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function parseHex(hex) {
      hex = hex.trim().replace(/^#/, '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
      return [
        parseInt(hex.substring(0, 2), 16),
        parseInt(hex.substring(2, 4), 16),
        parseInt(hex.substring(4, 6), 16)
      ];
    }

    // sRGB → linear
    function srgbToLinear(c) {
      c /= 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }

    // RGB → XYZ (D65)
    function rgbToXyz(rgb) {
      const r = srgbToLinear(rgb[0]), g = srgbToLinear(rgb[1]), b = srgbToLinear(rgb[2]);
      return [
        0.4124564 * r + 0.3575761 * g + 0.1804375 * b,
        0.2126729 * r + 0.7151522 * g + 0.0721750 * b,
        0.0193339 * r + 0.1191920 * g + 0.9503041 * b
      ];
    }

    // XYZ → CIELAB
    function xyzToLab(xyz) {
      const Xn = 0.95047, Yn = 1.00000, Zn = 1.08883;
      const f = t => t > 0.008856 ? Math.cbrt(t) : (903.3 * t + 16) / 116;
      const fx = f(xyz[0] / Xn), fy = f(xyz[1] / Yn), fz = f(xyz[2] / Zn);
      return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
    }

    function rgbToLab(rgb) { return xyzToLab(rgbToXyz(rgb)); }

    // Multiplicative LCHA scoring — hue angle based, achromatic-aware
    function scoreGuess(actual, guess) {
      const Lmax = 65, Cmax = 90, HmaxDeg = 80, Amax = 65, achromThresh = 10, pH = 1.5;
      const lab1 = rgbToLab(actual), lab2 = rgbToLab(guess);
      const dL = Math.abs(lab1[0] - lab2[0]);
      const C1 = Math.sqrt(lab1[1] * lab1[1] + lab1[2] * lab1[2]);
      const C2 = Math.sqrt(lab2[1] * lab2[1] + lab2[2] * lab2[2]);
      const dC = Math.abs(C1 - C2);
      const h1 = Math.atan2(lab1[2], lab1[1]) * 180 / Math.PI;
      const h2 = Math.atan2(lab2[2], lab2[1]) * 180 / Math.PI;
      let dHue = Math.abs(h1 - h2);
      if (dHue > 180) dHue = 360 - dHue;
      const achrom = Math.max(Math.max(0, 1 - C1 / achromThresh), Math.max(0, 1 - C2 / achromThresh));
      const achromDist = Math.max(C1, C2) * achrom;
      const sL = Math.max(0, 1 - (dL / Lmax) * (dL / Lmax));
      const sC = Math.max(0, 1 - (dC / Cmax) * (dC / Cmax));
      const sH = Math.max(0, 1 - Math.pow(dHue / HmaxDeg, pH));
      const sA = Math.max(0, 1 - (achromDist / Amax) * (achromDist / Amax));
      return Math.round(sL * sC * sH * sA * 100) / 10;
    }

    function scoreClass(s) {
      if (s >= 9.5) return 'score-perfect';
      if (s >= 8)   return 'score-great';
      if (s >= 6)   return 'score-good';
      if (s >= 4)   return 'score-ok';
      return 'score-poor';
    }

    function getRating(total) {
      if (total >= 49) return '🏆 You have an eyedropper tool in your brain';
      if (total >= 47) return '👁️‍🗨️ The hex whisperer';
      if (total >= 45) return '🧬 Color is literally in your DNA';
      if (total >= 43) return '🎨 Bob Ross would be proud';
      if (total >= 41) return '🔬 Your cones are overclocked';
      if (total >= 39) return '🌈 You see colors that don\'t exist yet';
      if (total >= 37) return '🧙 Wizard of #0z';
      if (total >= 35) return '💅 Pantone called — they want to hire you';
      if (total >= 33) return '🎯 Not bad, not bad at all';
      if (total >= 31) return '👀 Your eyes are showing promise';
      if (total >= 29) return '🤏 So close yet so far';
      if (total >= 26) return '🫣 A for effort, C for chromaticity';
      if (total >= 23) return '🎰 Were you guessing randomly? Be honest';
      if (total >= 20) return '🫠 The colors are merely a suggestion to you';
      if (total >= 16) return '🧑‍🎨 Art school might offer a refund';
      if (total >= 12) return '🐕 You may be a golden retriever';
      if (total >= 8)  return '🥔 You have the color sense of a potato';
      if (total >= 5)  return '😎 Have you tried taking the sunglasses off?';
      if (total >= 2)  return '👨‍⚕️ Have you checked with your eye doctor recently?';
      return '🏳️ You just typed random hex codes, didn\'t you';
    }

    function randomKey() {
      const c = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
      let r = '';
      for (let i = 0; i < 8; i++) r += c[Math.floor(Math.random() * c.length)];
      return r;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* ===== Init ===== */
    const params = new URLSearchParams(window.location.search);
    let gameKey = params.get('key');
    if (!gameKey) {
      gameKey = randomKey();
      window.location.replace('?key=' + gameKey);
    }

    const colors = generateColors(gameKey);
    document.getElementById('game-key').textContent = gameKey;

    /* Build tile UI */
    const tilesEl = document.getElementById('tiles');
    const inputs = [];

    colors.forEach((_, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';

      const num = document.createElement('div');
      num.className = 'tile-number';
      num.textContent = 'Color ' + (i + 1);

      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.dataset.idx = i;

      const inputRow = document.createElement('div');
      inputRow.className = 'input-row';

      const inputWrap = document.createElement('div');
      inputWrap.className = 'input-wrap';

      const hash = document.createElement('span');
      hash.className = 'hash-prefix';
      hash.textContent = '#';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'hex-input';
      input.placeholder = '------';
      input.maxLength = 6;
      input.spellcheck = false;
      input.autocomplete = 'off';
      input.dataset.idx = i;

      input.addEventListener('input', () => {
        let v = input.value.replace(/[^0-9a-fA-F]/g, '').substring(0, 6);
        input.value = v.toUpperCase();
        input.classList.remove('invalid');
        if (v.length === 6 && i < 4) {
          inputs[i + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (i < 4) {
            inputs[i + 1].focus();
          } else {
            submitGuesses();
          }
        }
      });

      inputs.push(input);

      inputWrap.appendChild(hash);
      inputWrap.appendChild(input);
      inputRow.appendChild(inputWrap);
      tile.appendChild(num);
      tile.appendChild(swatch);
      tile.appendChild(inputRow);
      tilesEl.appendChild(tile);
    });

    /* Set swatch colors via JS (not in source HTML) */
    requestAnimationFrame(() => {
      const swatches = document.querySelectorAll('.swatch');
      swatches.forEach((sw) => {
        const idx = parseInt(sw.dataset.idx);
        const [r, g, b] = colors[idx];
        sw.style.backgroundColor = 'rgb(' + r + ',' + g + ',' + b + ')';
      });
    });

    /* ===== Scoring ===== */
    let scores = null;

    function submitGuesses() {
      if (scores) return;
      const guesses = [];
      let allValid = true;

      for (let i = 0; i < 5; i++) {
        const input = inputs[i];
        const rgb = parseHex(input.value);
        if (!rgb) {
          input.classList.add('invalid');
          allValid = false;
        } else {
          input.classList.remove('invalid');
          guesses.push(rgb);
        }
      }

      if (!allValid) {
        showToast('⚠️ Enter a valid 6-digit hex for each color');
        return;
      }

      scores = guesses.map((g, i) => scoreGuess(colors[i], g));
      const total = Math.round(scores.reduce((a, b) => a + b, 0) * 10) / 10;

      document.getElementById('actions').style.display = 'none';
      inputs.forEach(el => el.disabled = true);

      /* Build result tiles */
      const resultTiles = document.getElementById('result-tiles');
      resultTiles.innerHTML = '';

      scores.forEach((s, i) => {
        const guess = parseHex(inputs[i].value);
        const rt = document.createElement('div');
        rt.className = 'result-tile';

        const comp = document.createElement('div');
        comp.className = 'comparison';

        const actualHalf = document.createElement('div');
        actualHalf.className = 'comp-half';
        actualHalf.style.backgroundColor = rgbToHex(...colors[i]);
        const aLabel = document.createElement('div');
        aLabel.className = 'comp-label';
        aLabel.textContent = 'actual';
        actualHalf.appendChild(aLabel);

        const guessHalf = document.createElement('div');
        guessHalf.className = 'comp-half';
        guessHalf.style.backgroundColor = rgbToHex(...guess);
        const gLabel = document.createElement('div');
        gLabel.className = 'comp-label';
        gLabel.textContent = 'yours';
        guessHalf.appendChild(gLabel);

        comp.appendChild(actualHalf);
        comp.appendChild(guessHalf);

        const sc = document.createElement('div');
        sc.className = 'result-score ' + scoreClass(s);
        sc.textContent = s.toFixed(1);

        const hexLbl = document.createElement('div');
        hexLbl.className = 'result-hex';
        hexLbl.textContent = rgbToHex(...colors[i]);

        const guessLbl = document.createElement('div');
        guessLbl.className = 'result-guess-hex';
        guessLbl.textContent = 'You: ' + rgbToHex(...guess);

        rt.appendChild(comp);
        rt.appendChild(sc);
        rt.appendChild(hexLbl);
        rt.appendChild(guessLbl);
        resultTiles.appendChild(rt);
      });

      const totalEl = document.getElementById('total-score');
      totalEl.className = 'total-score ' + scoreClass(total / 5);

      /* Animate score counter */
      let current = 0;
      const step = total / 40;
      const counter = setInterval(() => {
        current = Math.min(current + step, total);
        totalEl.textContent = current.toFixed(1);
        if (current >= total) clearInterval(counter);
      }, 20);

      document.getElementById('rating').textContent = getRating(total);
      document.getElementById('results').classList.add('visible');
    }

    /* ===== Share / New Game ===== */
    function shareResults() {
      if (!scores) return;
      const total = Math.round(scores.reduce((a, b) => a + b, 0) * 10) / 10;
      const blocks = scores.map(s => {
        if (s >= 9)  return '🟩';
        if (s >= 7)  return '🟨';
        if (s >= 5)  return '🟧';
        return '🟥';
      }).join('');
      const text = '\u{1F3A8} Chroma \u2014 ' + total.toFixed(1) + '/50\n' +
                   blocks + '\n' +
                   window.location.href;
      navigator.clipboard.writeText(text).then(
        () => showToast('✅ Copied to clipboard!'),
        () => showToast('❌ Could not copy')
      );
    }

    function retryGame() {
      window.location.href = '?key=' + gameKey;
    }

    function newGame() {
      window.location.href = '?key=' + randomKey();
    }

    /* Wire up buttons */
    document.getElementById('submit-btn').addEventListener('click', submitGuesses);
    document.getElementById('share-btn').addEventListener('click', shareResults);
    document.getElementById('retry-btn').addEventListener('click', retryGame);
    document.getElementById('new-btn').addEventListener('click', newGame);
    document.getElementById('randomize-btn').addEventListener('click', newGame);
  </script>
</body>
</html>
